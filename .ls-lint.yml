ls:
  # Source code
  src:
    .ts: kebab-case
    .tsx: kebab-case | PascalCase

  # Components - PascalCase for custom, kebab-case for ShadCN UI
  src/components:
    .tsx: PascalCase
    .ts: kebab-case

  src/components/ui:
    .tsx: kebab-case

  # Routes - kebab-case, plus the two shapes the router itself requires:
  # __root.tsx and dynamic segments like $tab.tsx / $verbId.tsx.
  src/routes:
    .tsx: kebab-case | regex:^__root$ | regex:^\$[a-zA-Z]+$
    .ts: kebab-case

  # Route-local components are PascalCase, as in src/components
  src/routes/components:
    .tsx: PascalCase
  src/routes/practice/components:
    .tsx: PascalCase | kebab-case
    .ts: kebab-case
  src/routes/reference/components:
    .tsx: PascalCase | kebab-case
    .ts: kebab-case

  # Scripts - kebab-case
  src/scripts:
    .ts: kebab-case

  # Constants, lib, types, db - kebab-case
  src/constants:
    .ts: kebab-case

  src/lib:
    .ts: kebab-case

  src/types:
    .ts: kebab-case

  src/db:
    .ts: kebab-case

  # Config files at root
  .:
    .ts: kebab-case
    .js: kebab-case
    .mjs: kebab-case

  # Workers
  workers:
    .ts: kebab-case

ignore:
  - node_modules
  - .git
  - .react-router
  - .wrangler
  - dist
  - build
  - drizzle
